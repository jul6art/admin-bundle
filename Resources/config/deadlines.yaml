# Chargé quand `admin.deadlines.entity` nomme l'entité de l'application (et ses paquets présents — l'extension
# le vérifie). L'application importe encore la route de l'écran et planifie `admin:deadlines:remind`.
services:
    _defaults:
        autowire: true

    # Les arguments propres à l'application (entité, destinataires, expéditeur, langue, fuseau) sont posés par
    # l'extension. `$providers` est rempli par le tag qu'`AdminBundle` autoconfigure sur le contrat.
    Jul6Art\AdminBundle\Deadline\DeadlineNotifier:
        arguments:
            $providers: !tagged_iterator admin.deadline_provider

    Jul6Art\AdminBundle\Command\DeadlineRemindCommand:
        tags:
            - { name: console.command, command: 'admin:deadlines:remind' }

    Jul6Art\AdminBundle\Form\DeadlineType:
        tags: [form.type]

    # ⚠️ `autoconfigure: false`, pour la raison de l'écran d'apparence (`controller.yaml`) : la route ne naît
    # que de l'import explicite du projet, sous le préfixe qu'il a choisi.
    Jul6Art\AdminBundle\Controller\DeadlineController:
        autoconfigure: false
        tags: ['controller.service_arguments', 'container.service_subscriber']
