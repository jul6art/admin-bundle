# Chargé uniquement quand Twig est présent : `twig/twig` est un `suggest`. Sans lui, il reste le
# contrat de navigation et les enums d'apparence, utiles à une application qui rend sa coquille
# autrement.
services:
    _defaults:
        autowire: true
        autoconfigure: true

    Jul6Art\AdminBundle\Twig\AdminUiExtension:
        arguments:
            $baseTemplate: '%admin.base_template%'
            $layoutTemplate: '%admin.layout_template%'
            $mercureHubUrl: '%admin.mercure.hub_url%'
            $mercureTokenRoute: '%admin.mercure.token_route%'
            # La table des routes est reconstituée ici plutôt que lue clé par clé dans le gabarit :
            # une clé absente doit rendre '' — donc masquer le lien — et non lever.
            $routes:
                login: '%admin.route.login%'
                logout: '%admin.route.logout%'
                register: '%admin.route.register%'
                reset_password_request: '%admin.route.reset_password_request%'
                profile: '%admin.route.profile%'
                change_password: '%admin.route.change_password%'
                appearance: '%admin.route.appearance%'
                privacy: '%admin.route.privacy%'
